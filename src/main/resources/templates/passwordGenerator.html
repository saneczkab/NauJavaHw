<!doctype html>
<html
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:th="https://www.thymeleaf.org"
  lang="en"
>
  <head>
    <title>Password generation</title>
    <link rel="stylesheet" type="text/css" href="/css/styles.css" />
  </head>
  <body>
    <form th:action="@{/generate}" method="post">
      <div>
        <label>
          <input type="checkbox" name="passContentLetters" />
          Latin letters (A-Z, a-z)
        </label>
      </div>
      <div>
        <label>
          <input type="checkbox" name="passContentDigits" />
          Digits (0-9)
        </label>
      </div>
      <div>
        <label>
          <input type="checkbox" name="passContentSymbols" />
          Symbols
        </label>
      </div>

      <div>
        <label>
          Password length:
          <input type="number" name="passLen" />
        </label>
      </div>
      <div>
        <label>
          Password count:
          <input type="number" name="passCount" />
        </label>
      </div>
      <div><input type="submit" value="Generate" /></div>
    </form>

    <div th:if="${message}">
      <div th:text="${message}"></div>
    </div>
  </body>
</html>
